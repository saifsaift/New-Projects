<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shuvo has a question for you 💕</title>
    <!-- Open Graph / WhatsApp / Telegram preview -->
    <meta property="og:title"       content="Shuvo has a question for you 💕">
    <meta property="og:description" content="Tap to find out what Shuvo wants to ask you…">
    <meta property="og:type"        content="website">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }

        /* ── Floating hearts background ── */
        .hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            opacity: 0.5;
            user-select: none;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0)      rotate(0deg);   opacity: 0.5; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0;   }
        }

        /* ── Name header ── */
        .name-header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 14px 20px;
            background: rgba(255,255,255,0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.45);
            text-align: center;
            z-index: 10;
        }

        .name-header h2 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(1.3rem, 5vw, 1.9rem);
            color: #c0392b;
            text-shadow: 1px 1px 4px rgba(255,255,255,0.7);
            letter-spacing: 2px;
        }

        .name-header h2 span { color: #e91e8c; }

        /* ── Link card ── */
        .link-card {
            position: relative;
            z-index: 5;
            background: rgba(255,255,255,0.90);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: clamp(32px, 9vw, 56px) clamp(28px, 10vw, 64px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(255,100,130,0.35), 0 0 0 1px rgba(255,255,255,0.5);
            width: min(88vw, 420px);
            animation: cardPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes cardPop {
            0%   { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .emoji-big {
            font-size: clamp(4rem, 14vw, 5.5rem);
            display: block;
            margin-bottom: 16px;
            animation: heartbeat 1.3s ease-in-out infinite;
            user-select: none;
        }

        @keyframes heartbeat {
            0%,100% { transform: scale(1);    }
            14%     { transform: scale(1.18); }
            28%     { transform: scale(1);    }
            42%     { transform: scale(1.12); }
            70%     { transform: scale(1);    }
        }

        .teaser-text {
            font-size: clamp(1.1rem, 4.5vw, 1.4rem);
            font-weight: 700;
            color: #c0392b;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .sub-text {
            font-size: clamp(0.78rem, 3vw, 0.92rem);
            color: #aaa;
            margin-bottom: 32px;
            font-weight: 300;
        }

        /* ── Big tap button ── */
        .btn-open {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: clamp(14px, 4vw, 18px) clamp(36px, 10vw, 56px);
            background: linear-gradient(135deg, #ff6b9d, #e91e8c);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: clamp(1.05rem, 4.5vw, 1.25rem);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(233,30,140,0.45);
            text-decoration: none;
            min-height: 56px;
            min-width: 180px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.18s, box-shadow 0.18s;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% { box-shadow: 0 8px 28px rgba(233,30,140,0.45); }
            50%     { box-shadow: 0 8px 42px rgba(233,30,140,0.75); }
        }

        .btn-open:active {
            transform: scale(0.95);
            box-shadow: 0 4px 16px rgba(233,30,140,0.35);
        }

        .hint-text {
            margin-top: 20px;
            font-size: clamp(0.72rem, 2.8vw, 0.85rem);
            color: #bbb;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <header class="name-header">
        <h2>✨ <span>Shuvo</span> ✨</h2>
    </header>

    <div class="link-card">
        <span class="emoji-big">💌</span>
        <p class="teaser-text">Shuvo has a special<br>question for you…</p>
        <p class="sub-text">Are you ready to find out? 😏</p>

        <a class="btn-open" href="index.html" id="openBtn">
            💕 Open the Question
        </a>

        <p class="hint-text">Tap the button above to see it</p>
    </div>

    <script>
    (function () {
        'use strict';

        /* ── Floating hearts ── */
        const heartsBg   = document.getElementById('heartsBg');
        const heartEmoji = ['💕','💖','💗','💓','💝','❤️','🌸','✨','🌺'];

        function spawnHeart() {
            const el = document.createElement('div');
            el.className   = 'heart-float';
            el.textContent = heartEmoji[Math.random() * heartEmoji.length | 0];
            el.style.left  = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 1.4 + 0.7) + 'rem';
            const dur = Math.random() * 6 + 5;
            el.style.animationDuration = dur + 's';
            el.style.animationDelay    = Math.random() * 2 + 's';
            heartsBg.appendChild(el);
            setTimeout(() => el.remove(), (dur + 3) * 1000);
        }
        for (let i = 0; i < 10; i++) spawnHeart();
        setInterval(spawnHeart, 700);

        /* ── Open button — navigate full-screen ── */
        const openBtn = document.getElementById('openBtn');

        openBtn.addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        openBtn.addEventListener('touchstart', function (e) {
            if (e.cancelable) e.preventDefault();
            window.location.href = 'index.html';
        }, { passive: false });
    })();
    </script>
</body>
</html>
